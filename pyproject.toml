[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archon"
version = "0.2.0"
description = "Archon — Autonomous agent with planner-executor-reflector architecture and LLM evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.7.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
huggingface = ["huggingface-hub>=0.24.0", "transformers>=4.44.0"]
langchain = [
    "langchain>=1.2.17",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
]
eval = [
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
]
web = [
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=6.2.0",
    "playwright>=1.47.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.5.0",
]
all = ["archon[openai,huggingface,langchain,eval,web,dev]"]

[project.scripts]
agent = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools", "evaluation", "config", "scripts"]

[tool.hatch.build.targets.sdist]
include = [
    "/agent",
    "/tools",
    "/evaluation",
    "/config",
    "/scripts",
    "/main.py",
    "/README.md",
    "/pyproject.toml",
    "/docs",
    "/CITATION.cff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring API keys",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
